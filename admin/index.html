<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Royal Ethnics Pune</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-maroon: #5a1420;
      --color-maroon-dark: #2a0a10;
      --color-gold: #c9a45c;
      --color-gold-light: #dfc285;
      --color-gold-dark: #a9833b;
      --color-cream: #FAF7F2;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Montserrat', -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-maroon-dark);
      background-image: 
        radial-gradient(circle at top right, rgba(201, 164, 92, 0.15) 0%, transparent 50%),
        radial-gradient(circle at bottom left, rgba(90, 20, 32, 0.4) 0%, transparent 60%);
      color: var(--color-cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: #1c060b;
      border: 1px solid rgba(201, 164, 92, 0.35);
      border-radius: 12px;
      padding: 2.75rem 2.25rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-crown {
      width: 44px;
      height: 44px;
      color: var(--color-gold);
      margin: 0 auto 0.75rem;
      display: block;
    }

    .brand-header h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #FFFFFF;
      margin-bottom: 0.35rem;
    }

    .brand-header h1 span {
      color: var(--color-gold);
      font-style: italic;
    }

    .brand-badge {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-gold);
      border: 1px solid rgba(201, 164, 92, 0.3);
      padding: 0.25rem 0.85rem;
      border-radius: 20px;
      background: rgba(201, 164, 92, 0.08);
    }

    .form-group {
      margin-bottom: 1.35rem;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-gold-light);
      margin-bottom: 0.5rem;
    }

    .form-control {
      width: 100%;
      height: 48px;
      padding: 0.75rem 1rem;
      background: rgba(42, 10, 16, 0.85);
      border: 1px solid rgba(201, 164, 92, 0.3);
      border-radius: 6px;
      color: #FFFFFF;
      font-size: 0.95rem;
      font-family: var(--font-sans);
      transition: all 0.25s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--color-gold);
      box-shadow: 0 0 0 3px rgba(201, 164, 92, 0.2);
      background: #2a0a10;
    }

    .alert {
      padding: 0.85rem 1rem;
      border-radius: 6px;
      font-size: 0.86rem;
      line-height: 1.45;
      margin-bottom: 1.35rem;
      display: none;
    }

    .alert-error {
      background: rgba(180, 25, 40, 0.2);
      border: 1px solid rgba(230, 60, 80, 0.6);
      color: #ffb4be;
    }

    .btn-login {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-gold-dark) 100%);
      color: #1a0508;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.25s ease;
      margin-top: 0.5rem;
    }

    .btn-login:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--color-gold-light) 0%, var(--color-gold) 100%);
      box-shadow: 0 4px 18px rgba(201, 164, 92, 0.4);
      transform: translateY(-1px);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-footer {
      text-align: center;
      margin-top: 1.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(201, 164, 92, 0.15);
    }

    .login-footer a {
      color: var(--color-gold);
      font-size: 0.8rem;
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.2s ease;
    }

    .login-footer a:hover {
      color: var(--color-gold-light);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <svg class="brand-crown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14v1H5z"></path>
        </svg>
        <h1>Royal Ethnics <span>Admin</span></h1>
        <span class="brand-badge">Authorized Access Only</span>
      </div>

      <div id="login-error" class="alert alert-error" role="alert"></div>

      <form id="admin-login-form" novalidate>
        <div class="form-group">
          <label for="admin-email">Admin Email</label>
          <input 
            type="email" 
            id="admin-email" 
            name="email" 
            class="form-control" 
            placeholder="admin@example.com" 
            required 
            autocomplete="username"
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="admin-password">Password</label>
          <input 
            type="password" 
            id="admin-password" 
            name="password" 
            class="form-control" 
            placeholder="Enter password" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="login-submit-btn" class="btn-login">
          <span>Sign In to Dashboard</span>
        </button>
      </form>

      <div class="login-footer">
        <a href="../index.html">&larr; Return to Royal Ethnics Home</a>
      </div>
    </div>
  </div>

  <!-- Supabase JS & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
  <script src="../js/config.js?v=2.3"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Ensure Supabase Client is ready
      if (!supabaseClient && typeof window.supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
        try {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {}
      }

      if (!supabaseClient) {
        showError('Supabase configuration is missing or failed to initialize. Please check js/config.js.');
        return;
      }

      // 2. If already logged in with an active session, redirect straight to dashboard
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          window.location.replace('dashboard.html');
          return;
        }
      } catch (err) {
        console.warn('Session check failed:', err);
      }

      // 3. Form submit handler
      const form = document.getElementById('admin-login-form');
      const errorEl = document.getElementById('login-error');
      const submitBtn = document.getElementById('login-submit-btn');

      function showError(msg) {
        if (!errorEl) return;
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
      }

      function clearError() {
        if (!errorEl) return;
        errorEl.textContent = '';
        errorEl.style.display = 'none';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        const email = document.getElementById('admin-email').value.trim();
        const password = document.getElementById('admin-password').value;

        if (!email || !password) {
          showError('Please enter both your email and password.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Verifying...</span>';

        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

          if (error) {
            console.error('Login error:', error);
            // Present clear and friendly error messages
            if (error.message.toLowerCase().includes('invalid login credentials') || error.message.toLowerCase().includes('invalid credentials')) {
              showError('Invalid email or password. Please verify your credentials and try again.');
            } else if (error.message.toLowerCase().includes('email not confirmed')) {
              showError('This email has not been confirmed yet. Please verify your email first.');
            } else {
              showError(error.message || 'Unable to sign in. Please check your credentials.');
            }
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Sign In to Dashboard</span>';
            return;
          }

          if (data && data.session) {
            submitBtn.innerHTML = '<span>Redirecting...</span>';
            window.location.replace('dashboard.html');
          } else {
            showError('Sign in completed but no session was returned. Please try again.');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Sign In to Dashboard</span>';
          }
        } catch (err) {
          console.error('Unexpected auth exception:', err);
          showError('An unexpected connection error occurred. Please try again.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Sign In to Dashboard</span>';
        }
      });
    });
  </script>
</body>
</html>
